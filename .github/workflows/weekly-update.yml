name: Weekly TWSE Data Update

on:
  schedule:
    - cron: '0 22 * * 5'
  workflow_dispatch:
    inputs:
      ref_date:
        description: 'Reference date (YYYYMMDD). Optional; defaults to today.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run weekly update
        id: weekly
        continue-on-error: true
        run: |
          if [ -n "${{ github.event.inputs.ref_date }}" ]; then
            python -m scripts.weekly "${{ github.event.inputs.ref_date }}"
          else
            python -m scripts.weekly
          fi

      - name: Create or Update GitHub Release
        if: ${{ steps.weekly.outputs.has_success == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.weekly.outputs.tag }}"
          ZIP="${{ steps.weekly.outputs.zip_path }}"
          PACKAGE_TAG="${{ steps.weekly.outputs.package_tag }}"
          PERIOD_START="${{ steps.weekly.outputs.period_start }}"
          PERIOD_END="${{ steps.weekly.outputs.period_end }}"
          NOTES="TWSE 每日收盤行情 (股票+ETF OHLCV)
          
          - Dataset tag: daily-close-csv
          - 資料覆蓋範圍: 20040211 ~ ${PERIOD_END}
          - 本次更新區間: ${PERIOD_START} ~ ${PERIOD_END}
          - 格式: CSV (UTF-8, 含 header)
          - 欄位: date, code, name, volume, open, high, low, close"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "Daily Close CSV: $PACKAGE_TAG" \
              --notes "$NOTES" \
              --latest
            gh release upload "$TAG" "$ZIP" --clobber
          else
            gh release create "$TAG" "$ZIP" \
              --title "Daily Close CSV: $PACKAGE_TAG" \
              --notes "$NOTES" \
              --latest
          fi

      - name: Send LINE notification for failures
        if: ${{ always() && steps.weekly.outputs.has_failures == 'true' }}
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TO: ${{ secrets.LINE_TO }}
          FAILURE_REPORT_PATH: ${{ steps.weekly.outputs.failure_report_path }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report_path = Path(os.environ["FAILURE_REPORT_PATH"])
          text = report_path.read_text(encoding="utf-8").strip()

          payload = {
              "to": os.environ["LINE_TO"],
              "messages": [
                  {
                      "type": "text",
                      "text": text,
                  }
              ],
          }

          Path("line_payload.json").write_text(
              json.dumps(payload, ensure_ascii=False),
              encoding="utf-8",
          )
          PY

          curl -sS -X POST "https://api.line.me/v2/bot/message/push" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${LINE_CHANNEL_ACCESS_TOKEN}" \
            --data-binary @line_payload.json

      - name: Mark workflow failed when all dates failed
        if: ${{ always() && steps.weekly.outcome == 'failure' }}
        run: |
          echo "weekly.py 無有效資料，保留 workflow 失敗狀態。"
          exit 1
